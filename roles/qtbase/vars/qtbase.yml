---
qtbase_git_repo:
  provider: "github"
  git_owner: "qt"
  name: "qtbase"
  tags: ["v6.7.3"] # defaults to latest tag or master workspace

qtbase_build:
  enabled: true
  script: ""
  checkinstall: true

qtbase_pkgs:
  apt: [
    build-essential,
    cmake,
    git,
    qtbase5-dev,
    qtdeclarative5-dev
    libqt5svg5-dev,
    ninja-build,
  ]
  dnf: []
  pacman: []
