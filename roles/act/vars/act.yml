---
git_repo:
  provider: "github"
  owner: "nektos"
  name: "act"

build:
  enable: true
  flags: ""
  script: "make"
  checkinstall: true

bashrc:
  enabled: true
  name: "{{ git_repo.name }}"
  marker: "# {mark} Ansible - {{ git_repo.name }}"
#   block: |
#     export PATH="{{ build_paths.install_path }}/{{ git_repo.name }}/{{  }}/bin/:$PATH"

pkgs:
  apt: [build-essential, git]
  dnf: []
  pacman: []
