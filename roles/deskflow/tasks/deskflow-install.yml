---
- name: Collect running user facts
  ansible.builtin.include_tasks: utilities/sudo_user_facts.yml
  when: sudo_user is not defined

- name: Install qtbase dependency
  ansible.builtin.include_tasks:
    file: pkgs-software-libs/pkgs-source/qtbase/qtbase-install.yml

- name: Install libportal dependency
  ansible.builtin.include_tasks:
    file: pkgs-software-libs/pkgs-source/libportal/libportal-install.yml

- name: Install libei dependency
  ansible.builtin.include_tasks:
    file: pkgs-software-libs/pkgs-source/libei/libei-install.yml

- name: Import deskflow vars
  ansible.builtin.include_vars:
    file: "pkgs-gui/pkgs-source/deskflow/deskflow.yml"

- name: Source Package Build Initialization Routine
  ansible.builtin.include_tasks: utilities/pkg-source-build-init-routine.yml
  when: sudo_user is defined
