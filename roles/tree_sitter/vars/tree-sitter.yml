---
git_repo:
  provider: "github"
  owner: "tree-sitter"
  name: "tree-sitter"
  tags: [] # defaults to latest tag or master workspace

build:
  enable: true
  script: "make"
  checkinstall: true
  library: true

pkgs:
  apt: [build-essential, cmake, git]
  dnf: []
  pacman: []
